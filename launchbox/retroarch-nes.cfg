# Project: VirtualGlove
# File: launchbox/retroarch-nes.cfg
# Purpose: Add VirtualGlove keys to RetroArch Player 1 without replacing its joypad.
# Author: Iain Bennett
# Copyright (c) 2026 Iain Bennett
# SPDX-License-Identifier: MIT
# Change log:
#   2026-09-16 - Added the LaunchBox Player 1 keyboard mapping.
# Full history: docs/CHANGELOG.md and Git history.

input_player1_a = "x"
input_player1_b = "z"
input_player1_start = "enter"
input_player1_select = "rshift"
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"

# Desktop LaunchBox play must not inherit RetroArch's touch-screen overlay.
input_overlay = ""
input_overlay_enable = "false"
input_overlay_enable_autopreferred = "false"
