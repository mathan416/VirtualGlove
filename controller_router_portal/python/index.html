<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose a controller · Controller Router</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #081827; color: #f4fbff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 80% 0%, #194257, transparent 44%), linear-gradient(145deg, #081827, #102b40); }
    main { max-width: 1100px; margin: auto; padding: clamp(24px, 5vw, 64px); }
    header { display: flex; align-items: center; gap: 17px; padding-bottom: 22px; border-bottom: 1px solid #42677a; }
    .mark { display: grid; place-items: center; width: 58px; height: 58px; border: 2px solid #68e6ed; border-radius: 18px; color: #68e6ed; box-shadow: 0 0 0 7px #68e6ed18; font-size: 26px; font-weight: 900; }
    .brand { font-size: 19px; font-weight: 900; letter-spacing: .16em; }
    .subtitle { color: #9cbcca; font-size: 13px; letter-spacing: .13em; text-transform: uppercase; }
    h1 { font-size: clamp(38px, 6vw, 68px); line-height: 1; letter-spacing: -.04em; margin: 44px 0 12px; }
    .intro { color: #b2cbd7; font-size: clamp(16px, 2vw, 19px); line-height: 1.5; margin: 0; max-width: 680px; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-top: 34px; }
    .card { position: relative; display: flex; flex-direction: column; min-height: 470px; overflow: hidden; isolation: isolate; border: 1px solid #416b7d; border-radius: 18px; background: #102b40; box-shadow: 0 20px 60px #0004; }
    .card::before { content: ""; position: absolute; inset: 0; z-index: -2; background: radial-gradient(circle at 72% 39%, #13d7ed30, transparent 45%), linear-gradient(145deg, #163d52, #0a1d2d 78%); }
    .card.rob_vision::before { background: radial-gradient(circle at 72% 39%, #f9755b2b, transparent 45%), linear-gradient(145deg, #19384f, #0a1d2d 78%); }
    .card::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, #091c2b 5%, #091c2beb 25%, transparent 67%); }
    .art { position: absolute; right: -10px; top: 10px; width: 66%; height: 240px; pointer-events: none; }
    .art img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 15px 25px #0007); }
    .card.virtualglove .art { right: 6px; top: 13px; width: 68%; height: 235px; }
    .copy { position: relative; margin-top: auto; padding: 26px; }
    .badge { display: inline-block; padding: 6px 9px; border: 1px solid #71dce070; color: #8de8ec; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .card h2 { font-size: clamp(30px, 3.3vw, 42px); line-height: 1; margin: 13px 0 5px; }
    .card p { color: #bad0d9; margin: 0 0 18px; line-height: 1.4; }
    button { width: 100%; min-height: 51px; border: 0; border-radius: 5px; background: #fb795d; color: #132333; font: 800 16px system-ui, sans-serif; cursor: pointer; }
    button:hover:not(:disabled), button:focus-visible { background: #ff9b80; outline: 2px solid #fff; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #message { min-height: 28px; margin-top: 23px; color: #8de8ec; }
    #message.error { color: #ffad9f; }
    @media (max-width: 720px) { .cards { grid-template-columns: 1fr; } .card { min-height: 425px; } .art { width: 58%; height: 195px; } .card.virtualglove .art { height: 195px; } }
    @media (prefers-reduced-motion: no-preference) { button { transition: background .15s ease; } }
  </style>
</head>
<body>
  <main>
    <header><span class="mark" aria-hidden="true">🎮</span><div><div class="brand">CONTROLLER ROUTER</div><div class="subtitle">Your game companions</div></div></header>
    <nav style="margin-top:20px"><a href="/setup" style="color:#8de8ec">Players and Systems</a> · <a class="pair-console-link" href="#" style="color:#8de8ec">Pair console</a> · <a href="/help" style="color:#8de8ec">Help</a></nav>
    <h1>Who’s playing?</h1>
    <p class="intro">Choose your companion. Both are ready in the background; opening one gives it control when no game is in progress.</p>
    <div class="cards" id="cards"></div>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>document.querySelector('.pair-console-link').href='http://'+(location.hostname.includes(':')?'['+location.hostname+']':location.hostname)+'/pair';
    const names = {
      virtualglove: { name: 'VirtualGlove', description: 'Move with Pixel Pal.', image: '/assets/pixel-pal.png' },
      rob_vision: { name: 'R.O.B. Vision', description: 'Play alongside Buddy.', image: '/assets/buddy.png' }
    };
    const cards = document.getElementById('cards');
    const message = document.getElementById('message');
    let navigating = false;
    let singleAutoAttempted = false;

    async function request(path, body) {
      const options = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
      const response = await fetch(path, options);
      return response.json();
    }
    function destination(port) {
      const path = port === 8101 ? '/dashboard/' : '/dashboard';
      window.location.assign(window.location.protocol + '//' + window.location.hostname + ':' + port + path);
    }
    function error(text) { message.className = 'error'; message.textContent = text; }

    async function openController(key, port, alreadySelected = false) {
      if (navigating) return;
      navigating = true;
      message.className = '';
      message.textContent = 'Opening ' + names[key].name + '…';
      try {
        if (!alreadySelected) {
          const result = await request('/api/select', { app: key });
          if (result.error || !result.accepted) throw new Error(result.error || 'Controller selection failed.');
        }
        destination(port);
      } catch (failure) {
        navigating = false;
        singleAutoAttempted = false;
        error(failure.message || 'The controller is unavailable. Please retry.');
      }
    }

    async function tick() {
      try {
        const state = await request('/api/state');
        if (state.error) throw new Error(state.error);
        const installed = Object.keys(names).filter(key => state.apps[key]?.installed);
        if (!installed.length) {
          cards.innerHTML = '';
          message.textContent = 'Install VirtualGlove or R.O.B. Vision to get started.';
          return;
        }
        if (installed.length === 1 && !navigating && !singleAutoAttempted && state.apps[installed[0]].ready) {
          singleAutoAttempted = true;
          const key = installed[0];
          openController(key, state.apps[key].port, state.apps[key].selected);
          return;
        }
        const gameActive = installed.some(key => state.apps[key].game_active);
        cards.innerHTML = installed.map(key => {
          const app = state.apps[key], detail = names[key];
          const label = app.selected ? 'ACTIVE' : app.ready ? 'READY' : 'UNAVAILABLE';
          const disabled = !app.ready || state.busy || (gameActive && !app.selected) || navigating;
          return `<section class="card ${key}"><div class="art"><img src="${detail.image}" alt="" loading="eager"></div><div class="copy"><span class="badge">${label}</span><h2>${detail.name}</h2><p>${detail.description}</p><button type="button" data-app="${key}" ${disabled ? 'disabled' : ''}>Open ${detail.name}</button></div></section>`;
        }).join('');
        cards.querySelectorAll('button').forEach(button => button.onclick = () => {
          const key = button.dataset.app;
          openController(key, state.apps[key].port, state.apps[key].selected);
        });
        if (state.error) error(state.error);
        else if (gameActive) { message.className = ''; message.textContent = 'A game is active. Open its current controller or exit the game to switch.'; }
        else if (!navigating) { message.className = ''; message.textContent = ''; }
      } catch (failure) {
        error(failure.message || 'Controller Router is unavailable. Please retry.');
      } finally {
        if (!navigating) window.setTimeout(tick, 1600);
      }
    }
    tick();
  </script>
</body>
</html>
