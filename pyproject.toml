# Project: VirtualGlove
# File: pyproject.toml
# Purpose: Define Python packaging metadata, dependencies, console commands, and source layout.
# Author: Iain Bennett
# Copyright (c) 2026 Iain Bennett
# SPDX-License-Identifier: MIT
# Change log:
#   2026-09-11 - Added supported Engineering Toolkit dependency groups.
#   2026-09-02 - Added to VirtualGlove.
#   2026-09-03 - Standardized source documentation and maintenance metadata.
# Full history: docs/CHANGELOG.md and Git history.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualglove"
version = "0.5.0"
description = "Camera-only hand controller for UNO Q and retro-gaming consoles"
license = {file = "LICENSE"}
requires-python = ">=3.7"
classifiers = ["License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
vision = [
  "mediapipe>=1.0.1,<2",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]
receiver = ["evdev>=1.7"]
launchbox = ["cryptography>=42"]
engineering-analysis = [
  "av==16.1.0",
  "numpy==1.26.4",
  "opencv-python-headless==4.11.0.86",
  "Pillow==12.3.0",
]
engineering = [
  "av==16.1.0",
  "mediapipe==0.10.35",
  "numpy==1.26.4",
  "opencv-python-headless==4.11.0.86",
  "Pillow==12.3.0",
]
dev = []
test = [
  "numpy==1.26.4",
  "opencv-python-headless==4.11.0.86",
]

[project.scripts]
virtualglove-games = "virtualglove.game_registry:main"
virtualglove = "virtualglove.vision_app:main"
virtualglove-receiver = "virtualglove.receiver:main"
virtualglove-profile = "virtualglove.profile_control:main"
virtualglove-retropie-hook = "virtualglove.retropie_hook:main"
virtualglove-console-monitor = "virtualglove.console_monitor:main"
virtualglove-pair = "virtualglove.pairing:main"
virtualglove-launchbox = "virtualglove.launchbox_hook:main"
virtualglove-launchbox-runtime = "virtualglove.launchbox_runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
