# Change log:
#   2026-09-11 - Build pinned Matrix firmware for compiler-free Controller installation.
#   2026-09-11 - Required an extracted Engineering Toolkit setup and workflow smoke test.
#   2026-09-09 - Installed the image-array dependencies required by pipeline tests.
#   2026-09-04 - Made dev the default source for release-candidate builds.
#   2026-09-04 - Added versioned two-machine release packaging.
# Full history: docs/CHANGELOG.md and Git history.

name: Build installation release
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Existing branch, commit or tag to build
        required: true
        default: dev
      version:
        description: New release tag (for example dev-COMMIT for a development build)
        required: true
      publish:
        description: Publish a GitHub release after validation
        type: boolean
        default: false
      prerelease:
        description: Mark as a development prerelease
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.0'
      - name: Prepare build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils rsync zip
          python -m pip install reportlab pypdf numpy opencv-python-headless
      - name: Test and build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -q
          python scripts/check-source-docs.py
          python scripts/build-enclosure-packages.py
          python website/build.py
          python scripts/build-docs-pdf.py
          python scripts/check-documentation.py --require-pdfs
          bash scripts/build-app-lab-package.sh
          python scripts/build-installer-scripts.py --check
          python scripts/build-install-packages.py --version "$RELEASE_VERSION"
          mkdir -p "$RUNNER_TEMP/virtualglove-toolkit"
          unzip -q output/install/VirtualGlove-Engineering-Tools.zip -d "$RUNNER_TEMP/virtualglove-toolkit"
          cd "$RUNNER_TEMP/virtualglove-toolkit/VirtualGlove-Engineering-Tools"
          python scripts/setup-engineering-tools.py
          mkdir smoke-input
          .venv-engineering/bin/python scripts/analyze-motion-samples.py \
            --samples-dir smoke-input --output smoke-output.json
          .venv-engineering/bin/python -c \
            "import json; assert len(json.load(open('smoke-output.json'))['simulation']) == 10"
          python scripts/setup-engineering-tools.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: installation-packages
          path: output/install/*
          if-no-files-found: error
      - name: Publish requested release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_VERSION" output/install/* --target "$(git rev-parse HEAD)" --title "VirtualGlove $RELEASE_VERSION" --generate-notes "${args[@]}"
