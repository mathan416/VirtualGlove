# Project: VirtualGlove
# File: .github/workflows/batocera-native-cores.yml
# Purpose: Build isolated Nestopia PowerGlove cores for all Batocera targets.
# Author: Iain Bennett
# Copyright (c) 2026 Iain Bennett
