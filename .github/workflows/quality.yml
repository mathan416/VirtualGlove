# Change log:
#   2026-09-11 - Build pinned Matrix firmware for the ordinary UNO Q package.
#   2026-09-11 - Added an extracted Engineering Toolkit setup and workflow smoke test.
#   2026-09-09 - Installed the image-array dependencies required by pipeline tests.
#   2026-09-03 - Added automated tests, audits, syntax checks, and package verification.
#   2026-09-03 - Aligned the test matrix with the declared Python 3.7 minimum.
#   2026-09-03 - Used Ubuntu 22.04 for the archived Python 3.7 toolchain.
#   2026-09-03 - Updated official actions to their Node 24 releases.
#   2026-09-03 - Added push validation for the dev integration branch.
# Full history: docs/CHANGELOG.md and Git history.

name: Quality and package verification

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.7"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pipeline test dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Check Python syntax
        run: python -m compileall -q python scripts src tests
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  documentation-and-package:
    name: Documentation and App Lab installation ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up pinned Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.0"
      - name: Install audit and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils rsync zip
          python -m pip install --disable-pip-version-check reportlab pypdf
      - name: Audit source and documentation
        run: |
          scripts/check-source-docs.py
          scripts/check-documentation.py
      - name: Check shell and JSON syntax
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
          for file in retropie/bin/* retropie/*.sh; do sh -n "$file"; done
          python -m json.tool config/device.example.json >/dev/null
          python -m json.tool config/games.json >/dev/null
          python -m json.tool config/launcher.example.json >/dev/null
          python -m json.tool config/profiles.json >/dev/null
          python -m json.tool config/release.json >/dev/null
          python -m json.tool hardware/enclosures/enclosure-files.json >/dev/null
      - name: Rebuild and inspect PDF editions
        run: |
          python scripts/build-enclosure-packages.py
          python website/build.py
          python scripts/build-docs-pdf.py
          scripts/check-documentation.py --require-pdfs
      - name: Build and verify App Lab installation ZIP
        run: |
          scripts/build-app-lab-package.sh
          scripts/verify-app-lab-package.py
          python scripts/build-installer-scripts.py --check
          python scripts/build-install-packages.py --version "dev-${GITHUB_SHA}"
      - name: Smoke-test extracted Engineering Toolkit
        run: |
          mkdir -p "$RUNNER_TEMP/virtualglove-toolkit"
          unzip -q output/install/VirtualGlove-Engineering-Tools.zip -d "$RUNNER_TEMP/virtualglove-toolkit"
          cd "$RUNNER_TEMP/virtualglove-toolkit/VirtualGlove-Engineering-Tools"
          python scripts/check-engineering-toolkit.py
          python scripts/setup-engineering-tools.py
          python scripts/setup-engineering-tools.py --check
      - name: Publish verified App Lab installation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VirtualGlove-Uno-Q
          path: output/app-lab/VirtualGlove-Uno-Q.zip
          if-no-files-found: error
          retention-days: 14
